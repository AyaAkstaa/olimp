<!DOCTYPE html>
<html lang="ru" class="{% if request.url.path == '/' %}no-scroll{% endif %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Олимпиада 1.5</title>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #E6007A;
            --white: #f5f5f5;
{% set is_blood = (request.url.path.startswith('/game') if request.url.path is defined else False) or request.url.path == '/results' or request.url.path == '/schedule' %}
<body class="{% if request.url.path == '/' %}no-scroll{% endif %}{% if is_blood %}blood-bg{% endif %}" {% if is_blood %}style="background-image: url('/static/main/МакетГлавной_0013_Кровь.png'); background-size: 100% auto; background-position: left top; background-attachment: fixed; background-repeat: repeat-y;"{% endif %}>
            --dark-gray: #121212;
            --gray: #222;
            --danger: #ff2d7b;
        }
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            font-family: 'Russo One', sans-serif;
            color: var(--white);
            -webkit-overflow-scrolling: touch;
            height: 100%;
        }
        body {
            background: #0a0a0a;
        }
        /* apply full-viewport blood background when body has class `blood-bg` */
        .blood-bg, html .blood-bg {
            background-image: url('/static/main/МакетГлавной_0013_Кровь.png');
            background-size: cover;
            background-position: center top;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }
        ::selection {
            background: var(--danger);
            color: var(--white);
        }
        a { color: inherit; text-decoration: none; }
        button, input, select { font-family: 'Russo One', sans-serif; }
        .navbar {
            background: rgba(0, 0, 0, 0.95);
            border-bottom: 4px solid var(--danger);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 36px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-right: 20px;
        }
        .nav-brand img {
            width: 48px;
            height: auto;
        }
        .nav-brand span {
            font-size: 0.95rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .nav-links {
            display: flex;
            gap: 26px;
            flex-wrap: wrap;
        }
        .nav-link {
            position: relative;
            color: var(--white);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 10px 6px;
            transition: color 0.2s ease;
        }
        .nav-link:hover,
        .nav-link.active {
            color: var(--danger);
        }
        .nav-link.active::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -3px;
            width: 100%;
            height: 3px;
            background: var(--danger);
            transform: skewX(-20deg);
        }
        .auth-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--danger);
            color: var(--white);
            background: transparent;
            padding: 12px 24px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            transition: background 0.25s ease, color 0.25s ease;
        }
        .auth-btn:hover {
            background: var(--danger);
            color: var(--black);
        }
        .auth-btn span {
            display: block;
        }
        .container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }
        .dangan-box {
            background: rgba(15, 15, 15, 0.96);
            color: var(--white);
            border: 4px solid var(--danger);
            padding: 22px;
            transform: skewX(-4deg);
            box-shadow: 12px 12px 0px rgba(230, 0, 122, 0.25);
            margin-bottom: 30px;
            position: relative;
        }
        .dangan-box > * {
            transform: skewX(4deg);
        }
        .title-splash {
            font-size: clamp(3rem, 6vw, 5.2rem);
            color: var(--white);
            text-transform: uppercase;
            line-height: 1.05;
            text-shadow: 4px 4px 0px rgba(230, 0, 122, 0.45);
            margin-bottom: 18px;
        }
        .small-note {
            color: var(--white);
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            margin-bottom: 18px;
        }
        .content-section {
            background: rgba(10, 10, 10, 0.85);
            border: 2px solid rgba(230, 0, 122, 0.55);
            padding: 28px;
        }
        .page-alert {
            margin: 0 0 24px;
            padding: 18px 20px;
            background: rgba(230, 0, 122, 0.14);
            border: 1px solid rgba(230, 0, 122, 0.5);
            color: var(--white);
            font-size: 0.95rem;
        }
        .index-page {
            padding: 0 !important;
        }
        @media (max-width: 840px) {
            .navbar { flex-direction: column; gap: 12px; align-items: stretch; padding: 20px; }
            .nav-links { justify-content: center; }
        }
        html.no-scroll, body.no-scroll { overflow: hidden; height: 100vh; }
        /* Elements that can show participants; tooltip is rendered by JS to avoid duplicate CSS pseudo-tooltips */
        .team-name[data-participants], .step-name[data-participants] { position: relative; cursor: default; }
        /* Floating JS tooltip (used when CSS pseudo-tooltip mispositions) */
        .float-tooltip {
            position: fixed;
            z-index: 10050;
            background: rgba(10,10,10,0.96);
            color: #fff;
            padding: 8px 10px;
            border-radius: 6px;
            max-width: 360px;
            font-size: 0.9rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.12s ease;
            word-break: break-word;
        }
    </style>
</head>
<body class="{% if request.url.path == '/' %}no-scroll{% endif %}{% if request.url.path.startswith('/game') or request.url.path == '/results' or request.url.path == '/schedule' %}blood-bg{% endif %}">

    <nav class="navbar">
        <div class="nav-brand">
            <img src="/static/main/МакетГлавной_0010_лого.png" alt="лого олимпиады">
            <span>Олимпиада</span>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">Главная</a>
            <a href="/schedule" class="nav-link {% if request.url.path == '/schedule' %}active{% endif %}">Расписание</a>
            <a href="/results" class="nav-link {% if request.url.path == '/results' %}active{% endif %}">Итоги</a>
            <a href="/admin" class="nav-link {% if request.url.path == '/admin' %}active{% endif %}">Кабинет</a>
        </div>
        <a href="/register" class="auth-btn"><span>Регистрация</span></a>
    </nav>

    <div class="{% if request.url.path not in ['/', '/olympiad'] %}container{% endif %}">
        {% block content %}{% endblock %}
    </div>

<script>
// Global floating tooltip for elements with `data-participants`
(function(){
    let tooltip = document.createElement('div');
    tooltip.className = 'float-tooltip';
    document.body.appendChild(tooltip);
    let visible = false;

    function show(el){
        const content = el.getAttribute('data-participants');
        if(!content) return;
        tooltip.textContent = content;
        tooltip.style.opacity = '1';
        visible = true;
        // initial placement
        const rect = el.getBoundingClientRect();
        const tw = tooltip.offsetWidth || 240;
        const th = tooltip.offsetHeight || 28;
        let top = rect.top - th - 8;
        let left = rect.left + rect.width/2 - tw/2;
        if(top < 8) top = rect.bottom + 8;
        if(left < 8) left = 8;
        if(left + tw > window.innerWidth - 8) left = window.innerWidth - tw - 8;
        tooltip.style.left = left + 'px';
        tooltip.style.top = top + 'px';
    }

    function hide(){ tooltip.style.opacity = '0'; visible = false; }

    document.addEventListener('mouseover', e=>{
        const el = e.target.closest('[data-participants]');
        if(el) show(el);
    });

    document.addEventListener('mousemove', e=>{
        if(!visible) return;
        const tw = tooltip.offsetWidth;
        let left = e.clientX - tw/2;
        if(left < 8) left = 8;
        if(left + tw > window.innerWidth - 8) left = window.innerWidth - tw - 8;
        let top = e.clientY + 18;
        if(top + tooltip.offsetHeight > window.innerHeight - 8) top = e.clientY - tooltip.offsetHeight - 18;
        tooltip.style.left = left + 'px';
        tooltip.style.top = top + 'px';
    });

    document.addEventListener('mouseout', e=>{
        const el = e.target.closest('[data-participants]');
        if(el) hide();
    });
})();
</script>

</body>
</html>
