<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Олимпиада по Играм | Отчаяние и Талант</title>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #E6007A;
            --white: #f5f5f5;
            --black: #090909;
            --dark-gray: #121212;
            --gray: #222;
            --danger: #ff2d7b;
        }
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            min-height: 100%;
            font-family: 'Russo One', sans-serif;
            background: radial-gradient(circle at top left, rgba(230,0,122,0.18), transparent 18%),
                        radial-gradient(circle at bottom right, rgba(255,255,255,0.08), transparent 28%),
                        linear-gradient(180deg, #0a0a0a 0%, #161616 100%);
            color: var(--white);
            overflow-x: hidden;
        }
        body {
            background-attachment: fixed;
        }
        ::selection {
            background: var(--danger);
            color: var(--white);
        }
        a { color: inherit; text-decoration: none; }
        button, input, select { font-family: 'Russo One', sans-serif; }
        .navbar {
            background: rgba(0, 0, 0, 0.95);
            border-bottom: 4px solid var(--danger);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 36px;
            position: sticky;
            top: 0;
            z-index: 20;
        }
        .nav-links {
            display: flex;
            gap: 26px;
            flex-wrap: wrap;
        }
        .nav-link {
            position: relative;
            color: var(--white);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 10px 6px;
            transition: color 0.2s ease;
        }
        .nav-link:hover,
        .nav-link.active {
            color: var(--danger);
        }
        .nav-link.active::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -3px;
            width: 100%;
            height: 3px;
            background: var(--danger);
            transform: skewX(-20deg);
        }
        .auth-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--danger);
            color: var(--white);
            background: transparent;
            padding: 12px 24px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            transition: background 0.25s ease, color 0.25s ease;
        }
        .auth-btn:hover {
            background: var(--danger);
            color: var(--black);
        }
        .auth-btn span {
            display: block;
        }
        .container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }
        .dangan-box {
            background: rgba(15, 15, 15, 0.96);
            color: var(--white);
            border: 4px solid var(--danger);
            padding: 22px;
            transform: skewX(-4deg);
            box-shadow: 12px 12px 0px rgba(230, 0, 122, 0.25);
            margin-bottom: 30px;
            position: relative;
        }
        .dangan-box > * {
            transform: skewX(4deg);
        }
        .title-splash {
            font-size: clamp(3rem, 6vw, 5.2rem);
            color: var(--white);
            text-transform: uppercase;
            line-height: 1.05;
            text-shadow: 4px 4px 0px rgba(230, 0, 122, 0.45);
            margin-bottom: 18px;
        }
        .small-note {
            color: var(--white);
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            margin-bottom: 18px;
        }
        .content-section {
            background: rgba(10, 10, 10, 0.85);
            border: 2px solid rgba(230, 0, 122, 0.55);
            padding: 28px;
        }
        .page-alert {
            margin: 0 0 24px;
            padding: 18px 20px;
            background: rgba(230, 0, 122, 0.14);
            border: 1px solid rgba(230, 0, 122, 0.5);
            color: var(--white);
            font-size: 0.95rem;
        }
        @media (max-width: 840px) {
            .navbar { flex-direction: column; gap: 12px; align-items: stretch; padding: 20px; }
            .nav-links { justify-content: center; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-links">
            <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">Главная</a>
            <a href="/olympiad" class="nav-link {% if request.url.path.startswith('/olympiad') %}active{% endif %}">Олимпиада</a>
            <a href="/admin" class="nav-link {% if request.url.path == '/admin' %}active{% endif %}">Админ</a>
        </div>
        <a href="/login" class="auth-btn"><span>Войти / Регистрация</span></a>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
