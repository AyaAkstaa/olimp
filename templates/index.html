{% extends "base.html" %}

{% block content %}
<style>
    .full-viewport {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-image: url('/static/main/МакетГлавной_фон.png');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        position: relative;
        overflow: hidden;
    }
    .full-viewport::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(0,0,0,0.15), rgba(0,0,0,0.08));
        pointer-events: none;
        z-index: 1;
    }
    .hero-container {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1.2fr;
        padding: 0 36px;
        position: relative;
        z-index: 2;
        margin-top: 100px;
    }
    .hero-left {
        display: grid;
        gap: 12px;
        justify-content: start;
    }
    .brand-small {
        display: none;
    }
    .hero-title-img {
        width: 100%;
        max-width: 830px;
        height: auto;
        display: block;
        margin-left: 50px;
        filter: drop-shadow(0 12px 40px rgba(0,0,0,0.4));
        transform-style: preserve-3d;
        transition: transform 0.1s ease-out;
    }
    .hero-right {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        position: relative;
        min-height: 480px;
        margin: 0 -50px 0 clamp(60px, 5vh, 80px);
    }
    .monokuma-giant {
        display: block;
        width: 100%;
        max-width: 700px;
        height: auto;
        cursor: pointer;
        transition: transform 0.25s ease;
        filter: drop-shadow(0 16px 50px rgba(0,0,0,0.5));
        position: relative;
        z-index: 3;
        margin-bottom: -80px;
        user-select: none;
    }
    .monokuma-giant:hover {
        transform: scale(1.03);
    }
    
    /* Анимированная предупредительная лента без швов */
    .diagonal-section {
        position: fixed;
        top: 570px;
        left: -5vw;
        right: -5vw;
        z-index: 4;
        height: 410px;
        
        /* Используем обычный градиент, разбитый по 25% для идеального тайлинга */
        background-image: linear-gradient(
            -45deg,
            #161616 25%,
            #8b6b15 25%,
            #8b6b15 50%,
            #161616 50%,
            #161616 75%,
            #8b6b15 75%,
            #8b6b15 100%
        );
        /* Задаем жесткий размер одного квадрата паттерна (целое число!) */
        background-size: 100px 100px; 
        
        transform: skewY(-2.5deg);
        transform-origin: left bottom;
        box-shadow: inset 0 80px 150px rgba(0,0,0,0.85), 
                    inset 0 -40px 100px rgba(0,0,0,0.7),
                    0 -30px 100px rgba(0,0,0,0.8);
        
        /* Оптимальная скорость для целого смещения */
        animation: scrollTape 4s linear infinite;
        pointer-events: none;
    }

    @keyframes scrollTape {
        0% { 
            background-position: 0px 0px; 
        }
        100% { 
            /* Смещение СТРОГО равно размеру background-size (100px) */
            background-position: 100px 0px; 
        }
    }

    .carousel-section {
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 480px;
        left: 0;
        right: 0;
        z-index: 5;
        padding: 0;
        align-items: center;
        justify-content: center;
        height: 460px; /* Увеличено, чтобы дать карточкам место для роста */
        transform: skewY(-2.5deg);
    }
    
    .games-carousel {
        display: flex;
        padding: 40px 60px; 
        overflow: visible; /* Обязательно visible, чтобы карточки не обрезались */
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        /* contain: paint удален, так как он ломал карточки при scale */
    }
    
    /* Карточки */
    .game-card {
        flex: 0 0 auto;
        width: 330px; 
        height: 450px;
        background-size: contain;
        background-position: center;
        background-repeat: no-repeat;
        background-color: transparent;
        position: relative;
        cursor: pointer;
        border: none;
        text-decoration: none;
        margin-bottom: -40px;
        
        margin-left: -80px;
        
        /* Затемнение и тень делаем только через filter, он уважает прозрачность PNG */
        filter: brightness(0.7) drop-shadow(0 15px 25px rgba(0,0,0,0.6));
        transition: transform 0.3s cubic-bezier(0.25, 1, 0.25, 1), 
                    filter 0.3s ease, 
                    margin 0.3s ease,
                    z-index 0.3s step-end;
    }
    
    .games-carousel .game-card:first-child {
        margin-left: 0;
    }

    /* Эффект при наведении */
    .game-card:hover {
        transform: scale(1.1) translateY(-25px); 
        /* Убираем затемнение, усиливаем тень */
        filter: brightness(1.1) drop-shadow(0 30px 45px rgba(0,0,0,0.9));
        z-index: 100;
        transition: transform 0.3s cubic-bezier(0.25, 1, 0.25, 1), 
                    filter 0.3s ease, 
                    margin 0.3s ease,
                    z-index 0.3s step-start; 
    }
    
    /* Раздвигаем соседние карточки при наведении */
    .game-card:hover + .game-card {
        margin-left: -20px; 
    }
    
    .game-card.neighbor-prev {
        margin-right: 30px; 
    }

    .game-card-overlay {
        display: none;
    }

    /* --- Стили для диалога Монокумы --- */
    .monokuma-dialogue {
        position: absolute;
        /* Позицию облака нужно будет подогнать под твою картинку */
        top: 18%; 
        left: 60%; 
        width: 350px;
        height: 260px;
        background-image: url('/static/main/МакетГлавной_0008_Диалог.png');
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        
        /* Центрируем текст внутри облака */
        display: flex;
        align-items: center;
        justify-content: center;
        
        /* padding подбирается так, чтобы текст не залезал на "хвостик" облака */
        padding: 20px 30px 60px 30px; 
        box-sizing: border-box;
        
        /* Анимация появления */
        opacity: 0;
        transform: scale(0.5) translateY(40px);
        transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        pointer-events: none; /* Чтобы облако не мешало кликать */
        z-index: 10;
    }

    .monokuma-dialogue.show {
        opacity: 1;
        transform: scale(1) translateY(0);
    }

    #monokuma-text {
        font-family: 'Arial', sans-serif; /* Замени на свой игровой шрифт, если есть */
        font-size: 18px;
        font-weight: 800;
        color: #E6007A;
        text-align: center;
        margin-top: 57px;
        align-items: center;
        line-height: 1.3;
    }

    @media (max-width: 1200px) {
        .hero-container {
            grid-template-columns: 1fr;
            gap: 16px;
            padding: 20px 24px;
        }
        .hero-right {
            min-height: 380px;
            margin: 0 -60px;
        }
        .monokuma-giant {
            max-width: 550px;
        }
        .game-card {
            width: 250px;
            height: 330px;
            margin-left: -40px;
        }
        .carousel-section {
            height: 400px;
        }
    }
    @media (max-width: 768px) {
        .hero-container {
            padding: 16px 20px;
        }
        .hero-title-img {
            max-width: 100%;
        }
        .hero-right {
            margin: 0 -40px;
            min-height: 300px;
        }
        .game-card {
            width: 200px;
            height: 270px;
            margin-left: -30px;
        }
        .carousel-section {
            height: 340px;
        }
        .diagonal-section {
            bottom: -30px;
            height: 380px;
        }
    }
</style>

<div class="full-viewport">
    <div class="hero-container">
        <div class="hero-left">
            <div class="hero-title-wrap">
                <img src="/static/main/МакетГлавной_0006_ОЛИМПИАДА-1.5-ПЛЯЖНЫЙ-ЭПИЗОД.png" alt="Олимпиада 1.5 Пляжный эпизод" class="hero-title-img">
            </div>
        </div>
        <div class="hero-right">
            <div class="monokuma-giant" id="monokuma-interact" title="Ну жми, чё">
                
                <div class="monokuma-dialogue" id="monokuma-dialogue">
                    <p id="monokuma-text"></p>
                </div>

                <img src="/static/main/МакетГлавной_0009_Монокума_в2.png" draggable="false" id="monokuma-sprite" alt="Монокума" style="width: 100%; height: auto; display: block; transition: opacity 0.2s ease;">
            </div>
            
            <div class="diagonal-section"></div>
        </div>
    </div>

    <div class="carousel-section">
        <div class="games-carousel">
            {% for game in games %}
            <a href="/game/{{ game.slug }}" class="game-card" style="background-image: url('/static/Карточки/{{ game_assets[game.slug] }}');" title="{{ game.name }}">
                <div class="game-card-overlay">
                    <div class="game-id">0{{ loop.index }}</div>
                    <h3 class="game-title">{{ game.name }}</h3>
                </div>
            </a>
            {% endfor %}
        </div>
    </div>
</div>

<script>
    
    const titleImg = document.querySelector('.hero-title-img');
    const gameCards = document.querySelectorAll('.game-card');
    const clamp = v => Math.max(-12, Math.min(12, v));
    
    let mouseX = 0, mouseY = 0;
    let titleRect = null;
    let rafId = null;
    let firstMessage = true;
    let monokumaClicks = 0;

    const hoverSound = new Audio('/static/main/hover.mp3');
    hoverSound.volume = 0.2; // Громкость от 0.0 до 1.0 (лучше делать тихим)

    if (titleImg) {
        titleImg.style.transformStyle = 'preserve-3d';

        const updateTitleRect = () => {
            titleRect = titleImg.getBoundingClientRect();
        }
        // Recompute when layout changes or image loads
        window.addEventListener('scroll', updateTitleRect);
        window.addEventListener('resize', updateTitleRect);
        window.addEventListener('load', updateTitleRect);
        document.addEventListener('DOMContentLoaded', updateTitleRect);
        titleImg.addEventListener('load', updateTitleRect);
        updateTitleRect();

        function animateTitle() {
            // Ensure rect is valid (image may load after initial measurement)
            if (!titleRect || titleRect.width === 0) updateTitleRect();
            if (titleRect && titleRect.top < window.innerHeight && titleRect.bottom > 0) {
                const x = ((mouseX - titleRect.left) / titleRect.width - 0.5) * 1.5;
                const y = ((mouseY - titleRect.top) / titleRect.height - 0.5) * 1.5;
                titleImg.style.transform = `rotateX(${clamp(-y * 16)}deg) rotateY(${clamp(x * 16)}deg)`;
            }
            rafId = null; 
        }

        document.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            if (rafId === null) {
                rafId = requestAnimationFrame(animateTitle);
            }
        });

        document.addEventListener('mouseleave', () => {
            if (rafId !== null) {
                cancelAnimationFrame(rafId);
                rafId = null;
            }
            titleImg.style.transform = 'rotateX(0deg) rotateY(0deg)';
        });
    }

    gameCards.forEach((card, index) => {
        card.addEventListener('mouseenter', () => {
            // --- ДОБАВЛЕНО ДЛЯ ЗВУКА ---
            // Сбрасываем время на 0, чтобы звук проигрывался заново, если быстро водить мышкой
            hoverSound.currentTime = 0; 
            // play() возвращает Promise, ловим ошибку, если браузер блокирует автоплей до первого клика по сайту
            hoverSound.play().catch(error => {
                console.log("Браузер заблокировал звук до взаимодействия с пользователем");
            });
            // ---------------------------
            if (index > 0) {
                gameCards[index-1].classList.add('neighbor-prev');
            }
        });
        card.addEventListener('mouseleave', () => {
            if (index > 0) {
                gameCards[index-1].classList.remove('neighbor-prev');
            }
        });
    });

    // --- Логика диалогов Монокумы ---
    const monokumaInteract = document.getElementById('monokuma-interact');
    const monokumaSprite = document.getElementById('monokuma-sprite');
    const monokumaDialogue = document.getElementById('monokuma-dialogue');
    const monokumaText = document.getElementById('monokuma-text');

    // Сохраняем путь к дефолтному спрайту
    const defaultSprite = '/static/main/МакетГлавной_0009_Монокума_в2.png';
    const angrySprite = '/static/main/МакетГлавной_0009_Монокума_Злой_в2.png';

    // База фраз. Добавляй свои тексты и указывай нужный спрайт
    const monokumaMessages = [
        { 
            text: "ХВАТИТ МЕНЯ ТРОГАТЬ!!", 
            sprite: angrySprite// УКАЖИ СВОЙ ПУТЬ
        },
        { 
            text: "Руки убрал", 
            sprite: angrySprite// УКАЖИ СВОЙ ПУТЬ
        },
        { 
            text: "Куда я жмав", 
            sprite: defaultSprite 
        },
        { 
            text: "Если нажать 100 раз, то будет мультик", 
            sprite: defaultSprite 
        },
        { 
            text: "Парень...", 
            sprite: defaultSprite 
        },
        { 
            text: "Отстань", 
            sprite: defaultSprite 
        },
        { 
            text: "Я тебя запомнил.", 
            sprite: angrySprite
        },
        { 
            text: "Не испытывай моё терпение.", 
            sprite: angrySprite
        },
        { 
            text: "Я похож на антистресс-игрушку?", 
            sprite: angrySprite
        },
        { 
            text: "Продолжишь — начислю штрафные баллы.", 
            sprite: angrySprite
        },
        { 
            text: "Это уже начинает выглядеть подозрительно.", 
            sprite: angrySprite
        },
        { 
            text: "Ещё раз ткнёшь — дисквалификация.", 
            sprite: angrySprite
        },
        { text: "Я бы помог, но я буквально картинка.", sprite: defaultSprite },
        { text: "С технической точки зрения ты сейчас общаешься с медведем.", sprite: defaultSprite },
        { text: "Проверка кнопки прошла успешно.", sprite: defaultSprite },
        { text: "Иногда мне кажется, что меня нажимают чаще, чем кнопку регистрации.", sprite: defaultSprite },
        { text: "Если найдёшь баг, сделай вид, что так и задумано.", sprite: defaultSprite },
        { text: "Профессиональный стоятель на главной странице.", sprite: defaultSprite },
        { text: "Я работаю за упоминание в титрах.", sprite: defaultSprite },
        { text: "Никакой секретной концовки тут нет. Наверное.", sprite: defaultSprite },
        { text: "Удивительно, но это тоже считается взаимодействием с сайтом.", sprite: defaultSprite },
        { text: "Пупупу... ой, это автоматически вырвалось.", sprite: defaultSprite },
        { text: "Я вообще-то декоративный.", sprite: defaultSprite },
        { text: "Олимпиада сама себя не проведёт.", sprite: defaultSprite },
        { text: "Ты ищешь секретку?", sprite: defaultSprite },
        { text: "Секретки нет. Наверное.", sprite: defaultSprite },
        { text: "Надеюсь, ты хотя бы зарегистрировался.", sprite: defaultSprite },
        { text: "Монополия сломала больше дружб, чем я.", sprite: defaultSprite },
        { text: "BedWars? Уважаю.", sprite: defaultSprite },
        { text: "Геогессеры уже определили твоё местоположение.", sprite: defaultSprite },
        { text: "Ещё один клик, и я напишу жалобу.", sprite: defaultSprite },
        { text: "Я считаю клики. Не спрашивай зачем.", sprite: defaultSprite },
        { text: "У тебя много свободного времени, да?", sprite: defaultSprite },
        { text: "Сайт проверяешь или меня раздражаешь?", sprite: defaultSprite },
        { text: "Продолжай. Мне даже интересно.", sprite: defaultSprite },
        { text: "Это точно часть олимпиады?", sprite: defaultSprite },
        { text: "Ты уже ближе к сотому клику.", sprite: defaultSprite },
        { text: "Монокума одобряет твоё упорство.", sprite: defaultSprite },
        { text: "Монокума больше не одобряет твоё упорство.", sprite: angrySprite},
        { text: "Ты буквально тыкаешь в медведя.", sprite: defaultSprite },
        { text: "Нажимай быстрее, я притворюсь кнопкой.", sprite: defaultSprite },
        { text: "Пупупупу!", sprite: defaultSprite },
        { text: "Это была фирменная реплика. Бесплатно.", sprite: defaultSprite },
        { text: "Ладно, признаю, мне нравится внимание.", sprite: defaultSprite },
        { text: "Согласно моим расчётам, ты существуешь.", sprite: defaultSprite },
        { text: "Моя работа — лежать. Твоя — перестать нажимать.", sprite: defaultSprite },
        { text: "Монокума.exe отвечает.", sprite: defaultSprite },
        { text: "К сожалению, это не мини-игра.", sprite: defaultSprite },
        { text: "Ты получил: ничего.", sprite: defaultSprite },
        { text: "Поздравляю. Медведь был нажат.", sprite: defaultSprite },
        {
            text: "Я тебе сейчас курсор откушу.",
            sprite: angrySprite
        },
        {
            text: "Последнее предупреждение.",
            sprite: angrySprite
        },
        {
            text: "Продолжай. Я составляю список.",
            sprite: angrySprite
        },
        {
            text: "Я уже придумал тебе наказание.",
            sprite: angrySprite
        },
        {
            text: "Ты очень смелый для человека в зоне досягаемости курсора.",
            sprite: angrySprite
        },
        {
            text: "Я начинаю болеть за твоих соперников.",
            sprite: angrySprite
        },
        { text: "Ты это специально делаешь?", sprite: defaultSprite },
        { text: "Я не кнопка. Пока что.", sprite: defaultSprite },
        { text: "Я проверил правила. Это не запрещено. К сожалению.", sprite: defaultSprite },
        { text: "Медведь занят. Попробуйте позже.", sprite: defaultSprite },
        { text: "Ого. Ещё один клик.", sprite: defaultSprite },
        { text: "Мы оба знаем, что ты нажмёшь ещё раз.", sprite: defaultSprite },
        { text: "Надеюсь, ты так же упорен на олимпиаде.", sprite: defaultSprite },
        { text: "Ты тестировщик или просто любопытный?", sprite: defaultSprite },
        { text: "Меня предупреждали насчёт пользователей.", sprite: defaultSprite },
        { text: "Я расскажу об этом организаторам.", sprite: defaultSprite },
        { text: "Это считается общением?", sprite: defaultSprite },
        { text: "Пупупу... да, у меня закончились идеи.", sprite: defaultSprite },
        { text: "Я начинаю подозревать автокликер.", sprite: defaultSprite },
        { text: "С каждым кликом я становлюсь чуть менее дружелюбным.", sprite: defaultSprite },
        { text: "Клик зарегистрирован. Жалоба тоже.", sprite: defaultSprite },
    ];

    let dialogueTimeout;

    if (monokumaInteract) {
        monokumaInteract.addEventListener('click', () => {
            monokumaClicks += 1;
            let randomMsg = monokumaMessages[0];
            if (firstMessage) {
                randomMsg = { 
                    text: "Пу-ху-ху! Добро пожаловать!", 
                    sprite: defaultSprite 
                };
                firstMessage = false;
            }
            else if (monokumaClicks == 100) {
                window.location.href = "/watch";
            }
            else {
                randomMsg = monokumaMessages[Math.floor(Math.random() * monokumaMessages.length)];
            }
            
            // 2. Устанавливаем текст
            monokumaText.textContent = randomMsg.text;
            
            // 3. Меняем спрайт (с легким миганием для плавности, если нужно)
            monokumaSprite.style.opacity = '0.8';
            setTimeout(() => {
                monokumaSprite.src = randomMsg.sprite;
                monokumaSprite.style.opacity = '1';
            }, 50);
            
            // 4. Показываем облако
            monokumaDialogue.classList.add('show');
            
            // 5. Очищаем таймер, если игрок кликает быстро-быстро
            clearTimeout(dialogueTimeout);
            
            // 6. Прячем диалог через 4 секунды
            dialogueTimeout = setTimeout(() => {
                monokumaDialogue.classList.remove('show');
                
                // Возвращаем дефолтный спрайт после исчезновения текста
                setTimeout(() => { 
                    monokumaSprite.src = defaultSprite; 
                }, 300);
            }, 4000);
        });
    }
</script>
{% endblock %}
