{% extends "base.html" %}

{% block content %}
<style>
    .login-grid {
        display: grid;
        grid-template-columns: minmax(260px, 1fr) minmax(360px, 1fr);
        gap: 32px;
        align-items: center;
        margin-top: 24px;
    }
    .login-card {
        background: rgba(15,15,15,0.96);
        border: 2px solid rgba(230,0,122,0.65);
        padding: 30px;
        box-shadow: 12px 12px 0px rgba(230,0,122,0.12);
    }
    .login-title {
        margin: 0 0 14px;
        font-size: 2rem;
        color: var(--white);
    }
    .login-copy {
        color: #ddd;
        line-height: 1.7;
        margin-bottom: 24px;
    }
    .login-form {
        display: grid;
        gap: 18px;
    }
    .login-form label {
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #fff;
    }
    .login-form input {
        padding: 14px;
        border: 2px solid rgba(230,0,122,0.75);
        background: #121212;
        color: #fff;
        outline: none;
    }
    .login-form button {
        margin-top: 8px;
        padding: 16px;
        border: none;
        background: var(--danger);
        color: var(--black);
        text-transform: uppercase;
        cursor: pointer;
    }
    .login-image {
        display: flex;
        justify-content: center;
    }
    .login-image img {
        width: min(100%, 420px);
        transform: rotate(-8deg);
        border: 6px solid rgba(255,255,255,0.15);
        background: #111;
    }
    .login-alert {
        padding: 16px;
        border: 1px solid rgba(230,0,122,0.5);
        background: rgba(230,0,122,0.08);
        color: #fff;
    }
    @media (max-width: 860px) {
        .login-grid { grid-template-columns: 1fr; }
    }
</style>

<div class="login-grid">
    <div class="login-card">
        <h1 class="login-title">Вход в Академию</h1>
        <p class="login-copy">Введите свои данные, чтобы получить доступ к панели управления результатами и продолжить путь студента-наблюдателя Дэгдэнронпы.</p>
        {% if message %}
        <div class="login-alert">{{ message }}</div>
        {% endif %}
        <form action="/login" method="POST" class="login-form">
            <label>Имя участника</label>
            <input type="text" name="username" placeholder="Имя Таланта" required>
            <label>Пароль</label>
            <input type="password" name="password" placeholder="Пароль" required>
            <button type="submit">Войти</button>
        </form>
    </div>
    <div class="login-image">
        <img src="https://static.wikia.nocookie.net/danganronpa/images/5/51/Monokuma.png" alt="Monokuma">
    </div>
</div>
{% endblock %}
